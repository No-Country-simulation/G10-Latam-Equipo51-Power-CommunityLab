limit_req_zone $binary_remote_addr zone=im_login:1m rate=10r/m;

server {
    listen 80;
    server_name insightmind.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name insightmind.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/insightmind.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insightmind.duckdns.org/privkey.pem;

    server_tokens off;

    root /var/www/insightmind;
    index index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;

    # nginx no trae image/avif en mime.types: sin esto las fotos del hero de la landing
    # salen como application/octet-stream. Sin add_header aquí, para heredar las cabeceras
    # de seguridad del server.
    location ~* \.avif$ {
        types { }
        default_type image/avif;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/api/(docs|redoc|openapi\.json|sincronizar|download|files) {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=im_login burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:8000/auth/login;
    }

    location /api/ {
        limit_except GET POST PUT { deny all; }

        proxy_pass http://127.0.0.1:8000/;
    }
}
