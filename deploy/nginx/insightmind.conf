# InsightMind · nginx en localhost, solo HTTP, sin dominio.
#   /      -> front estático (/var/www/insightmind)
#   /api/  -> uvicorn en 127.0.0.1:8000 (el prefijo /api se quita)
# La autenticación la hace la propia API (cookie de sesión): ver backend/auth.py.
#
# Instalar:  sudo cp deploy/nginx/insightmind.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx

# Freno al login por IP (se suma al bloqueo de 5 fallos que ya hace la API).
limit_req_zone $binary_remote_addr zone=im_login:1m rate=10r/m;

server {
    # Solo loopback: http://localhost/ . Para abrirlo a la red/IP de la VM cambia a:  listen 80;
    listen 127.0.0.1:80;
    server_name localhost;
    server_tokens off;

    root  /var/www/insightmind;
    index index.html;
    client_max_body_size 20m;                 # subida de mensajes JSON

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        same-origin always;

    # Parámetros de proxy comunes (los heredan todos los location con proxy_pass)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;                  # /procesar y /generar llaman a Cohere

    # ---- Front estático (público: contiene solo la pantalla de login y el JS) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;   # el navegador revalida: un cambio del front se ve al recargar
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location ~ /\. { deny all; }              # nada de dotfiles

    # ---- Rutas del backend que NO salen por nginx, ni con sesión ----
    location ~ ^/api/(docs|redoc|openapi\.json|sincronizar|download|files) {
        return 404;
    }

    # ---- Login: con límite de peticiones ----
    location = /api/auth/login {
        limit_req zone=im_login burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000/auth/login;
    }

    # ---- Resto de la API (la sesión la exige FastAPI; sin cookie responde 401) ----
    location /api/ {
        limit_except GET POST PUT { deny all; }   # sin DELETE
        proxy_pass http://127.0.0.1:8000/;        # la "/" final quita el prefijo /api
    }
}
